apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: floodgate
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: floodgate
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 70}
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
