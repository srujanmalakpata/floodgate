image:
  repository: ghcr.io/srujanmalakpata/floodgate
  tag: ""            # defaults to .Chart.AppVersion
  pullPolicy: IfNotPresent

replicaCount: 2

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

podDisruptionBudget:
  minAvailable: 1

resources:
  requests: {cpu: 100m, memory: 64Mi}
  limits: {cpu: "1", memory: 256Mi}

service:
  type: ClusterIP
  port: 80

# Name of an existing Secret with key "password" for Redis AUTH (optional).
redisPasswordSecret: ""

# Rendered verbatim into the gateway's config.yaml (see examples/config.yaml).
config:
  listen: ":8080"
  admin_listen: ":9090"
  upstream: "http://upstream:9000"
  log_level: info
  backend:
    type: redis
    redis:
      addr: "redis:6379"
      key_prefix: rlgw
      timeout: 50ms
      password_env: REDIS_PASSWORD
    failure_policy: local
    breaker: {failure_threshold: 5, cooldown: 5s}
  key:
    header: X-API-Key
    trusted_proxy_hops: 1
  routes:
    # key_by api_key: one budget per key; ip_limit caps one IP across rotating made-up keys
    - {name: api, path_prefix: /api/, algorithm: token_bucket, limit: 100, window: 1m, key_by: api_key, ip_limit: 300}
  default: {algorithm: token_bucket, limit: 600, window: 1m}
  reload: {interval: 5s}
  shutdown: {drain_delay: 5s, timeout: 15s}
