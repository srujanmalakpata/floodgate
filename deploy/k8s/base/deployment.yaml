apiVersion: apps/v1
kind: Deployment
metadata:
  name: floodgate
spec:
  # No spec.replicas: the HPA owns the replica count (minReplicas: 2), and a
  # value here would reset it on every `kubectl apply -k`.
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels:
      app.kubernetes.io/component: gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/component: gateway
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: /metrics
    spec:
      # > shutdown.drain_delay (5s) + shutdown.timeout (15s), so Kubernetes
      # never SIGKILLs a pod that is still finishing requests.
      terminationGracePeriodSeconds: 30
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/component: gateway
      containers:
        - name: gateway
          image: floodgate
          args: ["-config", "/etc/rlgw/config.yaml"]
          ports:
            - {name: http, containerPort: 8080}
            - {name: admin, containerPort: 9090}
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef: {name: floodgate-redis, key: password, optional: true}
          readinessProbe:
            httpGet: {path: /readyz, port: admin}
            periodSeconds: 2
            failureThreshold: 2
          livenessProbe:
            httpGet: {path: /healthz, port: admin}
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests: {cpu: 100m, memory: 64Mi}
            limits: {cpu: "1", memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: config, mountPath: /etc/rlgw, readOnly: true}
      volumes:
        - name: config
          configMap:
            name: floodgate-config
