name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  # The vulnerability scans (govulncheck, Trivy) also run weekly, so a newly
  # published advisory can surface between code changes.
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: floodgate:ci
  # Trivy runs from its official image pinned by digest rather than through
  # aquasecurity/trivy-action: a mutable action tag can be re-pointed by an
  # attacker, a digest cannot. Bump both parts together (docker buildx
  # imagetools inspect aquasec/trivy:<version> prints the digest).
  TRIVY_IMAGE: aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: go mod tidy is clean
        run: go mod tidy && git diff --exit-code go.mod go.sum
      - name: go vet
        run: go vet ./...
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The patched minimum declared in go.mod (also used by Docker), and
        # current stable Go for forward compatibility.
        go: ["1.26.8", "stable"]
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 2s --health-timeout 2s --health-retries 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
      - name: Unit, integration and end-to-end tests (race detector on)
        env:
          # Also runs the limiter conformance suite against a real Redis.
          RLGW_TEST_REDIS: localhost:6379
        run: go test -race -count=1 -coverprofile=coverage.out ./...
      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1
      - name: Benchmarks (smoke run, numbers are not compared)
        run: go test -run '^$' -bench . -benchtime 200x ./...
      - name: govulncheck (minimum release toolchain and current stable)
        # Pinned so a tool release cannot change results without a commit;
        # bump by hand (Dependabot does not track `go run pkg@version`).
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  docker:
    runs-on: ubuntu-latest
    needs: [lint, test]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Trivy image scan (fail on fixable HIGH/CRITICAL)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY_IMAGE" \
            image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "$IMAGE"
      - name: Compose smoke test (2 replicas share one Redis-backed limit)
        run: |
          docker tag "$IMAGE" floodgate:dev
          docker compose up -d --no-build --wait --wait-timeout 180
          ./scripts/demo-shared-limits.sh 16 | tee demo.txt
          grep -q "allowed=10 limited=6" demo.txt
      - name: Compose logs on failure
        if: failure()
        run: docker compose logs
      - name: Tear down
        if: always()
        run: docker compose down

  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: hashicorp/setup-terraform@v4
      - uses: azure/setup-helm@v4
      - name: Terraform fmt / init / validate (never applied)
        working-directory: deploy/terraform/aws
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false
          terraform validate
      - name: Install kubeconform
        run: go install github.com/yannh/kubeconform/cmd/kubeconform@v0.6.7
      - name: Validate Kubernetes manifests (kustomize + kubeconform)
        run: |
          for dir in deploy/k8s/base deploy/k8s/overlays/local; do
            kubectl kustomize "$dir" | kubeconform -strict -summary -kubernetes-version 1.31.0 -
          done
      - name: Helm lint and validate rendered chart
        run: |
          helm lint deploy/helm/floodgate
          helm template demo deploy/helm/floodgate | kubeconform -strict -summary -kubernetes-version 1.31.0 -
      - name: Trivy IaC misconfiguration scan
        # Intentional exceptions are annotated inline (#trivy:ignore) with a reason.
        run: |
          docker run --rm -v "$PWD:/src:ro" -w /src "$TRIVY_IMAGE" \
            config --severity HIGH,CRITICAL --exit-code 1 deploy

  release:
    # Pushes the image to GitHub Container Registry on version tags (free for public repos).
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [docker, infra]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      # Build once, scan that exact image, then push it: the published image is
      # the one Trivy checked (not a second, unscanned build).
      - name: Build release image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ github.ref_name }}
          cache-from: type=gha
      - name: Trivy scan of the release image
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          first=$(echo "$TAGS" | head -n1)
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY_IMAGE" \
            image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "$first"
      - name: Check the binary reports the tag
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          first=$(echo "$TAGS" | head -n1)
          docker run --rm "$first" -version | tee version.txt
          grep -qF "${{ github.ref_name }}" version.txt
      - name: Push the scanned image
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          for tag in $TAGS; do docker push "$tag"; done
