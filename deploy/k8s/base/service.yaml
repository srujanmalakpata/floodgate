# Application traffic only. Point an Ingress or LoadBalancer at this Service.
apiVersion: v1
kind: Service
metadata:
  name: floodgate
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/component: gateway
  ports:
    - {name: http, port: 80, targetPort: http}
---
# Admin endpoints (/healthz, /readyz, /metrics) in a separate, cluster-internal
# Service, so changing the public Service's type never exposes them.
apiVersion: v1
kind: Service
metadata:
  name: floodgate-admin
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/component: gateway
  ports:
    - {name: admin, port: 9090, targetPort: admin}
